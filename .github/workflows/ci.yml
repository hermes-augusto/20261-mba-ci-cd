name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-site:
    name: Validar site estatico
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivo principal
        run: test -f site/index.html

      - name: Validar conteudo minimo
        run: grep -q "Meu deploy automatizado" site/index.html

      - name: Validar integracao com API do GitHub
        run: grep -q "https://api.github.com/repos/hermes-augusto/20261-mba-ci-cd" site/index.html

      - name: Validar metrica publica de CI/CD
        run: grep -q "topic:github-actions" site/index.html

      - name: Validar tratamento de erro da API
        run: grep -q "Nao foi possivel carregar" site/index.html

      - name: Publicar artefato do site
        uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: site/
